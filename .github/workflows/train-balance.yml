name: Train balance AI
on:
  push:
    branches: [main]
    paths:
      - 'train.py'
      - 'evaluate.py'
      - 'export_replay.py'
      - 'robot_lab/**'
      - 'assets/robot.xml'
      - 'requirements.txt'
  workflow_dispatch:
    inputs:
      timesteps:
        description: PPO training timesteps
        required: true
        default: '20000'
        type: choice
        options:
          - '20000'
          - '50000'
          - '100000'
          - '200000'
          - '400000'
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Validate physics and evaluation
        run: python -m unittest discover -s tests -v
      - name: Train PPO
        run: python train.py --steps ${{ github.event_name == 'workflow_dispatch' && inputs.timesteps || '20000' }} --output models/balance_ppo
      - name: Evaluate trained policy
        run: python evaluate.py --model models/balance_ppo.zip --episodes 10 --first-seed 1000 --json evaluation.json --require-all-success
      - name: Export 3D replay
        if: ${{ !cancelled() && hashFiles('models/balance_ppo.zip') != '' }}
        run: python export_replay.py --model models/balance_ppo.zip --output replays/trained-robot.json
      - name: Upload model and evaluation
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: balance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            models/balance_ppo.zip
            models/balance_ppo.last.zip
            models/balance_ppo.training.json
            evaluation.json
            replays/trained-robot.json
          if-no-files-found: warn
          retention-days: 7
