name: Train balance AI
on:
  workflow_dispatch:
    inputs:
      timesteps:
        description: PPO training timesteps
        required: true
        default: '200000'
        type: choice
        options:
          - '20000'
          - '50000'
          - '100000'
          - '200000'
          - '400000'
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Train PPO
        run: python train.py --steps ${{ inputs.timesteps }} --output models/balance_ppo
      - name: Evaluate trained policy
        run: python evaluate.py --model models/balance_ppo.zip --episodes 10 | tee evaluation.txt
      - name: Export 3D replay
        run: python export_replay.py --model models/balance_ppo.zip --output replays/trained-robot.json
      - name: Upload model and evaluation
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: balance-improved-experiment
          path: |
            models/balance_ppo.zip
            evaluation.txt
            replays/trained-robot.json
          if-no-files-found: warn
          retention-days: 7
