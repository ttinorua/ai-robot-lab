name: Physics validation
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  physics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-t-duck.txt
      - name: Compile Python sources
        run: python -m compileall -q robot_lab train.py evaluate.py t_duck_eval.py tests
      - name: Run MuJoCo physics smoke tests
        run: python -m unittest discover -s tests -v
