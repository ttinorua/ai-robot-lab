name: Physics validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  physics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q robot_lab train.py evaluate.py improve_settling.py tests
      - name: Run MuJoCo physics smoke tests
        run: |
          python -m unittest discover -s tests -p test_physics.py -v
          python -m unittest discover -s tests -p test_evaluation.py -v
          python -m unittest discover -s tests -p test_robustness.py -v
          python -m unittest discover -s tests -p test_settling.py -v
