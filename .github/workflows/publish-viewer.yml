name: Publish 3D Robot Viewer
on:
  push:
    branches: [main]
    paths:
      - 'viewer/**'
      - '.github/workflows/publish-viewer.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest trained replay
        uses: actions/download-artifact@v4
        with:
          name: balance-first-experiment
          run-id: 40034990075
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: training-output
      - name: Install trained replay in viewer
        run: cp training-output/replays/trained-robot.json viewer/trained-robot.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer
      - id: deployment
        uses: actions/deploy-pages@v4
