name: Publish 3D Robot Viewer
on:
  push:
    branches: [main]
    paths:
      - 'viewer/**'
      - '.github/workflows/publish-viewer.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Deploy the reviewed replay with this commit, rather than replacing it
      # with an unrelated, potentially expired historical training artifact.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer
      - id: deployment
        uses: actions/deploy-pages@v4
