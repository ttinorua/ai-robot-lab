name: T-Duck Companion APK
on:
  pull_request:
    paths: ['apps/t-duck-companion/**', 'docs/protocol/**', 'tools/t-duck-mock/**', '.github/workflows/t-duck-companion.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: companion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Protocol tests
        run: python -m unittest discover -s tools/t-duck-mock -p 'test_*.py' -v
      - name: Unit tests, lint and debug build
        working-directory: apps/t-duck-companion
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify installable APK metadata and signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs apps/t-duck-companion/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging apps/t-duck-companion/app/build/outputs/apk/debug/app-debug.apk
          sha256sum apps/t-duck-companion/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: T-Duck-Companion-v0.1-debug
          path: apps/t-duck-companion/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-test-evidence
          path: |
            apps/t-duck-companion/app/build/reports/tests
            apps/t-duck-companion/app/build/reports/lint-results-debug.html
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            gradle -p apps/t-duck-companion --no-daemon connectedDebugAndroidTest
            adb shell am force-stop com.tduck.companion
            adb shell am start -n com.tduck.companion/.MainActivity
            sleep 2
            adb shell screencap -p /sdcard/companion-home.png
            adb pull /sdcard/companion-home.png apps/t-duck-companion/app/build/companion-home.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-emulator-evidence
          path: |
            apps/t-duck-companion/app/build/reports/androidTests
            apps/t-duck-companion/app/build/outputs/androidTest-results
            apps/t-duck-companion/app/build/companion-home.png
