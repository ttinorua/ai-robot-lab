name: T-Duck readiness
on:
  pull_request:
    paths:
      - 'docs/T_DUCK_ROADMAP.md'
      - 'tests/test_t_duck_readiness.py'
      - 'assets/robot.xml'
      - '.github/workflows/t-duck-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify migration prerequisites (not motion)
        run: python -m unittest discover -s tests -p 'test_t_duck_readiness.py' -v
